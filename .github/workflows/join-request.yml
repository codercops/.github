name: Process Join Request

# Two stages:
#   1. When a join request is opened, check the username and merged PRs, then
#      either close it with an explanation or mark it `awaiting-approval`.
#   2. Nobody is invited until an org admin adds the `approved` label.
#
# Never put issue content into a script with ${{ }}. Anything the requester
# typed is read from the event payload inside the script, validated, and
# passed between steps through env vars only.

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  triage:
    if: github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'join-request')
    runs-on: ubuntu-latest
    steps:
      - name: Check request
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_ADMIN_TOKEN }}
          script: |
            const match = (context.payload.issue.body || '').match(/### GitHub Username\s*\n\s*\n\s*(.+)/);
            const username = match ? match[1].trim().replace(/^@/, '') : '';
            if (!/^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$/.test(username)) {
              core.setOutput('decision', 'invalid');
              return;
            }
            core.setOutput('username', username);

            try {
              await github.rest.users.getByUsername({ username });
            } catch {
              core.setOutput('decision', 'not-found');
              return;
            }

            try {
              const { data } = await github.rest.orgs.getMembershipForUser({ org: 'codercops', username });
              if (data.state === 'active') {
                core.setOutput('decision', 'member');
                return;
              }
            } catch {
              // Not a member yet.
            }

            const { data: prs } = await github.rest.search.issuesAndPullRequests({
              q: `org:codercops type:pr is:merged is:public author:${username}`,
              per_page: 10,
            });
            if (prs.total_count === 0) {
              core.setOutput('decision', 'needs-pr');
              return;
            }
            core.setOutput('decision', 'pending');
            core.setOutput('count', String(prs.total_count));
            core.setOutput('links', prs.items.map((pr) => `- ${pr.html_url}`).join('\n'));

      - name: Reply
        uses: actions/github-script@v7
        env:
          DECISION: ${{ steps.check.outputs.decision }}
          USERNAME: ${{ steps.check.outputs.username }}
          COUNT: ${{ steps.check.outputs.count }}
          LINKS: ${{ steps.check.outputs.links }}
        with:
          script: |
            const { DECISION, USERNAME, COUNT, LINKS } = process.env;
            const issue_number = context.issue.number;
            const repo = context.repo;
            const reply = (body) => github.rest.issues.createComment({ ...repo, issue_number, body });
            const close = (labels) => github.rest.issues.update({ ...repo, issue_number, state: 'closed', labels });

            switch (DECISION) {
              case 'invalid':
                await reply('That does not look like a valid GitHub username. Please open a new request with your exact username.');
                await close(['join-request', 'invalid']);
                break;
              case 'not-found':
                await reply(`The GitHub username \`${USERNAME}\` does not exist. Please check for typos and open a new request.`);
                await close(['join-request', 'invalid']);
                break;
              case 'member':
                await reply(`@${USERNAME} is already a member of CODERCOPS. Nothing to do here.`);
                await close(['join-request']);
                break;
              case 'needs-pr':
                await reply([
                  `Hey @${USERNAME}, we couldn't find any merged pull requests from you in the codercops repos yet.`,
                  '',
                  'Pick an issue labeled [`good first issue`](https://github.com/search?q=org%3Acodercops+label%3A%22good+first+issue%22+state%3Aopen&type=issues), open a PR, and once it is merged you are welcome to apply again.',
                ].join('\n'));
                await close(['join-request', 'needs-pr']);
                break;
              case 'pending':
                await reply([
                  `Thanks @${USERNAME}! We found ${COUNT} merged PR(s) from you:`,
                  '',
                  LINKS,
                  '',
                  'A maintainer reviews every request by hand, so this can take a few days. cc @anurag629',
                ].join('\n'));
                await github.rest.issues.addLabels({ ...repo, issue_number, labels: ['awaiting-approval'] });
                break;
              default:
                core.setFailed(`Unexpected decision: ${DECISION}`);
            }

  invite:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'approved' &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'join-request')
    runs-on: ubuntu-latest
    steps:
      - name: Invite approved requester
        id: invite
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_ADMIN_TOKEN }}
          script: |
            // Only an org admin's approval counts.
            const approver = context.payload.sender.login;
            core.setOutput('approver', approver);
            let isAdmin = false;
            try {
              const { data } = await github.rest.orgs.getMembershipForUser({ org: 'codercops', username: approver });
              isAdmin = data.state === 'active' && data.role === 'admin';
            } catch {}
            if (!isAdmin) {
              core.setOutput('result', 'not-admin');
              return;
            }

            const match = (context.payload.issue.body || '').match(/### GitHub Username\s*\n\s*\n\s*(.+)/);
            const username = match ? match[1].trim().replace(/^@/, '') : '';
            if (!/^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$/.test(username)) {
              core.setOutput('result', 'failed');
              return;
            }
            core.setOutput('username', username);

            try {
              const { data: team } = await github.rest.teams.getByName({ org: 'codercops', team_slug: 'members' });
              const { data: user } = await github.rest.users.getByUsername({ username });
              await github.rest.orgs.createInvitation({ org: 'codercops', invitee_id: user.id, team_ids: [team.id] });
              core.setOutput('result', 'invited');
            } catch (e) {
              core.warning(`Invite failed: ${e.message}`);
              core.setOutput('result', 'failed');
            }

      - name: Reply
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.invite.outputs.result }}
          USERNAME: ${{ steps.invite.outputs.username }}
          APPROVER: ${{ steps.invite.outputs.approver }}
        with:
          script: |
            const { RESULT, USERNAME, APPROVER } = process.env;
            const issue_number = context.issue.number;
            const repo = context.repo;
            const removeLabel = (name) =>
              github.rest.issues.removeLabel({ ...repo, issue_number, name }).catch(() => {});

            if (RESULT === 'not-admin') {
              await removeLabel('approved');
              core.notice(`Ignored approval from ${APPROVER}: not an org admin.`);
            } else if (RESULT === 'invited') {
              await github.rest.issues.createComment({
                ...repo,
                issue_number,
                body: [
                  `Welcome to CODERCOPS, @${USERNAME}!`,
                  '',
                  'An invitation is on its way. Check your email or [GitHub notifications](https://github.com/notifications) to accept it.',
                ].join('\n'),
              });
              await removeLabel('awaiting-approval');
              await github.rest.issues.update({ ...repo, issue_number, state: 'closed' });
            } else {
              await github.rest.issues.createComment({
                ...repo,
                issue_number,
                body: `Something went wrong sending the invite. @${APPROVER} will follow up.`,
              });
              await github.rest.issues.addLabels({ ...repo, issue_number, labels: ['needs-manual-review'] });
            }
